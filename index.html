<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Search</title>
  <script src="/baremux/index.js"></script>
  <script src="/scram/scramjet.all.js"></script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #121212;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #ui {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      padding: 12px 16px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      width: 300px;
      outline: none;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    .yt-btn {
      background: #dc2626;
    }
    .wisp-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #aaa;
    }
    #wispUrl {
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #ddd;
      width: 240px;
    }
    #status {
      font-size: 13px;
      color: #60a5fa;
      max-width: 560px;
      text-align: center;
      min-height: 20px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    #homeBtn {
      display: none;
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 9999;
      padding: 10px 16px;
    }
    #viewport {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1 style="margin: 0;">Custom Search</h1>
    <form class="row" onsubmit="event.preventDefault(); runSearch();">
      <input id="query" type="text" placeholder="Search or enter URL..." />
      <button id="goBtn" type="submit">Go</button>
      <button class="yt-btn" type="button" onclick="openUrl('https://youtube.com')">YouTube</button>
    </form>
    <div class="wisp-row">
      <label for="wispUrl">Wisp Server:</label>
      <input id="wispUrl" type="text" />
    </div>
    <div id="status">Initializing Scramjet...</div>
  </div>

  <button id="homeBtn" type="button" onclick="closeViewport()">Home</button>
  <iframe id="viewport"></iframe>

  <script>
    const DEFAULT_WISP = 'wss://wisp.mercurywork.shop/';
    const SEARCH_BASE = 'https://duckduckgo.com';

    const queryInput = document.getElementById('query');
    const wispInput = document.getElementById('wispUrl');
    const statusEl = document.getElementById('status');
    const viewport = document.getElementById('viewport');
    const homeBtn = document.getElementById('homeBtn');

    let scramjet = null;
    let connection = null;
    let initPromise = null;

    function withTimeout(promise, ms, label) {
      return Promise.race([
        promise,
        new Promise((_, reject) =>
          setTimeout(() => reject(new Error(label + ' timed out after ' + (ms / 1000) + 's')), ms)
        )
      ]);
    }

    function getValidWisp(raw) {
      try {
        const u = new URL((raw || '').trim());
        if ((u.protocol === 'wss:' || u.protocol === 'ws:') && u.hostname.includes('.')) {
          return u.href.endsWith('/') ? u.href : u.href + '/';
        }
      } catch (_) {}
      return DEFAULT_WISP;
    }

    wispInput.value = getValidWisp(localStorage.getItem('custom_wisp_url'));

    function closeViewport() {
      viewport.style.display = 'none';
      homeBtn.style.display = 'none';
      viewport.src = 'about:blank';
    }

    function formatTargetUrl(input) {
      const trimmed = input.trim();
      if (/^https?:\/\//i.test(trimmed)) return new URL(trimmed).href;
      if (/^[a-z0-9-]+(\.[a-z0-9-]+)+(\/.*)?$/i.test(trimmed)) {
        return new URL('https://' + trimmed).href;
      }
      return SEARCH_BASE + encodeURIComponent(trimmed);
    }

    async function initProxy() {
      if (initPromise) return initPromise;
      initPromise = (async () => {
        try {
          if (location.protocol === 'file:') {
            throw new Error('Cannot run from file:// — use a local server (http://localhost) or HTTPS');
          }
          if (typeof $scramjetLoadController !== 'function') {
            throw new Error('Missing /scram/scramjet.all.js');
          }
          if (typeof BareMux === 'undefined') {
            throw new Error('Missing /baremux/index.js');
          }

          statusEl.textContent = 'Step 1/3: Loading Scramjet...';
          const { ScramjetController } = $scramjetLoadController();
          scramjet = new ScramjetController({
            prefix: '/scramjet/',
            files: {
              wasm: '/scram/scramjet.wasm.wasm',
              all: '/scram/scramjet.all.js',
              sync: '/scram/scramjet.sync.js'
            }
          });
          await withTimeout(scramjet.init(), 4000, 'scramjet.init()');

          statusEl.textContent = 'Step 2/3: Registering /sw.js...';
          await withTimeout(
            navigator.serviceWorker.register('/sw.js', { scope: '/' }),
            4000,
            'Service Worker register(/sw.js)'
          );
          await withTimeout(
            navigator.serviceWorker.ready,
            4000,
            'Service Worker ready (check /sw.js)'
          );

          statusEl.textContent = 'Step 3/3: Starting BareMux...';
          connection = new BareMux.BareMuxConnection('/baremux/worker.js');
          statusEl.textContent = 'Ready (Scramjet v1)';
        } catch (err) {
          initPromise = null;
          throw err;
        }
      })();
      return initPromise;
    }

    async function openUrl(targetUrl) {
      try {
        await initProxy();
        const wispServer = getValidWisp(wispInput.value);
        wispInput.value = wispServer;
        localStorage.setItem('custom_wisp_url', wispServer);

        statusEl.textContent = 'Connecting to Wisp...';
        await withTimeout(
          connection.setTransport('/epoxy/index.mjs', [{ wisp: wispServer }]),
          5000,
          'setTransport(/epoxy/index.mjs)'
        );

        viewport.src = scramjet.encodeUrl(targetUrl);
        viewport.style.display = 'block';
        homeBtn.style.display = 'block';
        statusEl.textContent = 'Loaded ' + targetUrl;
      } catch (err) {
        statusEl.textContent = 'Error: ' + (err.message || err);
        console.error(err);
      }
    }

    function runSearch() {
      const val = queryInput.value.trim();
      if (!val) return;
      openUrl(formatTargetUrl(val));
    }

    initProxy().catch((err) => {
      statusEl.textContent = 'Init Error: ' + (err.message || err);
      console.error(err);
    });
  </script>
</body>
</html>
