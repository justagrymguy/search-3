<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoCookie Player</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #121212;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 14px;
      padding: 16px;
      box-sizing: border-box;
    }
    .bar {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 800px;
    }
    input {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      border-radius: 8px;
      border: none;
      outline: none;
    }
    button {
      padding: 12px 18px;
      font-size: 15px;
      border-radius: 8px;
      border: none;
      background: #dc2626;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .presets button {
      background: #27272a;
      font-size: 13px;
      padding: 8px 12px;
    }
    iframe {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      border: none;
      border-radius: 12px;
      background: #000;
    }
  </style>
</head>
<body>
  <form class="bar" onsubmit="event.preventDefault(); playInput();">
    <input id="urlInput" type="text" placeholder="Paste YouTube link or 11-char Video ID..." />
    <button type="submit">Watch</button>
  </form>

  <div class="presets">
    <button type="button" onclick="loadId('Sf_4HxUU7mk')">Best of CamNeverEnding 2025</button>
    <button type="button" onclick="loadId('lQygL-EQL0Q')">Suicide Bombing in JJS</button>
    <button type="button" onclick="loadId('cWF2WK_wTxs')">Teaming YouTuber Bug Abusing</button>
    <button type="button" onclick="loadId('PSN2tJTEYNE')">Corniest Runner Ever</button>
  </div>

  <iframe
    id="player"
    src="https://youtube-nocookie.com/embed/"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>

  <script>
    function loadId(id) {
      document.getElementById('player').src = 'https://youtube-nocookie.com' + id + '?autoplay=1';
    }

    function playInput() {
      const str = document.getElementById('urlInput').value.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(str)) {
        loadId(str);
        return;
      }
      const match = str.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([a-zA-Z0-9_-]{11})/);
      if (match) {
        loadId(match);
      } else {
        alert('Enter a valid YouTube URL or 11-character Video ID.');
      }
    }
  </script>
</body>
</html>
