<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Search</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #121212;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #ui {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      padding: 12px 16px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      width: 300px;
      outline: none;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    .wisp-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #aaa;
    }
    #wispUrl {
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #ddd;
      width: 240px;
    }
    #status {
      font-size: 13px;
      color: #60a5fa;
      max-width: 560px;
      text-align: center;
      min-height: 20px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    #homeBtn {
      display: none;
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 9999;
      padding: 10px 16px;
    }
    #viewport {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1 style="margin: 0;">Custom Search</h1>
    <form class="row" onsubmit="event.preventDefault(); runSearch();">
      <input id="query" type="text" placeholder="Search or enter URL..." />
      <button id="goBtn" type="submit">Go</button>
    </form>
    <div class="wisp-row">
      <label for="wispUrl">Wisp Server:</label>
      <input id="wispUrl" type="text" />
    </div>
    <div id="status">Ready (v13)</div>
  </div>

  <button id="homeBtn" type="button" onclick="closeViewport()">Home</button>
  <iframe id="viewport"></iframe>

  <script>
    const DEFAULT_WISP = 'wss://wisp.mercurywork.shop/';
    const DDG_BASE = 'https://duckduckgo.com';

    const queryInput = document.getElementById('query');
    const wispInput = document.getElementById('wispUrl');
    const statusEl = document.getElementById('status');
    const viewport = document.getElementById('viewport');
    const homeBtn = document.getElementById('homeBtn');

    function getValidWisp(raw) {
      try {
        const u = new URL((raw || '').trim());
        if ((u.protocol === 'wss:' || u.protocol === 'ws:') && u.hostname.includes('.')) {
          return u.href.endsWith('/') ? u.href : u.href + '/';
        }
      } catch (_) {}
      return DEFAULT_WISP;
    }

    wispInput.value = getValidWisp(localStorage.getItem('custom_wisp_url'));

    function closeViewport() {
      viewport.style.display = 'none';
      homeBtn.style.display = 'none';
      viewport.src = 'about:blank';
    }

    function unwrapUrl(rawUrl) {
      try {
        const u = new URL(rawUrl);
        if (u.hostname.includes('duckduckgo.com') && u.searchParams.has('uddg')) {
          return u.searchParams.get('uddg');
        }
      } catch (_) {}
      return rawUrl;
    }

    function formatTargetUrl(input) {
      const trimmed = input.trim();
      try {
        if (/^https?:\/\//i.test(trimmed)) return new URL(trimmed).href;
        if (/^[a-z0-9-]+(\.[a-z0-9-]+)+(\/.*)?$/i.test(trimmed)) {
          return new URL('https://' + trimmed).href;
        }
      } catch (_) {}
      const searchUrl = new URL(DDG_BASE);
      searchUrl.searchParams.set('q', trimmed);
      return searchUrl.href;
    }

    async function loadPage(rawUrl) {
      let step = 'Step 1/3: Loading local Epoxy...';
      statusEl.textContent = step;

      try {
        const targetUrl = unwrapUrl(rawUrl);
        const wispServer = getValidWisp(wispInput.value);
        wispInput.value = wispServer;
        localStorage.setItem('custom_wisp_url', wispServer);

        const mod = await import('./epoxy.js');
        const exp = mod.default && typeof mod.default === 'object' ? { ...mod.default, ...mod } : mod;

        step = 'Step 2/3: Connecting to Wisp...';
        statusEl.textContent = step;

               const TransportClass = exp.default || exp.EpoxyTransport || exp.EpoxyClient;
        const transport = new TransportClass({ wisp: wispServer });
        if (typeof transport.init === 'function') {
          await transport.init();
        }

        step = 'Step 3/3: Fetching ' + targetUrl + '...';
        statusEl.textContent = step;

        let html;
        if (typeof transport.request === 'function') {
          const res = await transport.request(
            new URL(targetUrl),
            'GET',
            null,
            { 'User-Agent': navigator.userAgent },
            null
          );
          html = await new Response(res.body).text();
        } else {
          const res = await transport.fetch(new URL(targetUrl), { method: 'GET' });
          html = await res.text();
        }


        const baseTag = '<base href="' + targetUrl + '" />';
        const patchedHtml = /<head[^>]*>/i.test(html)
          ? html.replace(/<head[^>]*>/i, (match) => match + baseTag)
          : baseTag + html;

        const blob = new Blob([patchedHtml], { type: 'text/html' });
        viewport.onload = () => {
          try {
            const doc = viewport.contentDocument;
            if (!doc) return;
            doc.addEventListener('click', (e) => {
              const a = e.target.closest('a[href]');
              if (!a) return;
              const href = a.getAttribute('href');
              if (!href || href.startsWith('#') || href.startsWith('javascript:')) return;
              e.preventDefault();
              loadPage(new URL(href, targetUrl).href);
            }, true);
          } catch (_) {}
        };

        viewport.src = URL.createObjectURL(blob);
        viewport.style.display = 'block';
        homeBtn.style.display = 'block';
        statusEl.textContent = 'Ready (v13)';
      } catch (err) {
        statusEl.textContent = 'Failed at [' + step + ']\nError: ' + err.message;
      }
    }

    function runSearch() {
      try {
        const val = queryInput.value.trim();
        if (!val) return;
        loadPage(formatTargetUrl(val));
      } catch (err) {
        statusEl.textContent = 'Search Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
