<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Search</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #121212;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #ui {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      padding: 12px 16px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      width: 300px;
      outline: none;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    .wisp-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #aaa;
    }
    #wispUrl {
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #ddd;
      width: 240px;
    }
    #status {
      font-size: 13px;
      color: #60a5fa;
      max-width: 520px;
      text-align: center;
      min-height: 20px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    #homeBtn {
      display: none;
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 9999;
      padding: 10px 16px;
    }
    #viewport {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1 style="margin: 0;">Custom Search</h1>
    <div class="row">
      <input id="query" type="text" placeholder="Search or enter URL..." />
      <button id="goBtn" type="button">Go</button>
    </div>
    <div class="wisp-row">
      <label for="wispUrl">Wisp Server:</label>
      <input id="wispUrl" type="text" value="wss://wisp.mercurywork.shop/" />
    </div>
    <div id="status">Script Active</div>
  </div>

  <button id="homeBtn" type="button">Home</button>
  <iframe id="viewport"></iframe>

  <script>
    const queryInput = document.getElementById('query');
    const goBtn = document.getElementById('goBtn');
    const wispInput = document.getElementById('wispUrl');
    const statusEl = document.getElementById('status');
    const viewport = document.getElementById('viewport');
    const homeBtn = document.getElementById('homeBtn');

    if (localStorage.getItem('custom_wisp_url')) {
      wispInput.value = localStorage.getItem('custom_wisp_url');
    }

    homeBtn.onclick = () => {
      viewport.style.display = 'none';
      homeBtn.style.display = 'none';
      viewport.src = 'about:blank';
    };

    function formatTargetUrl(input) {
      const trimmed = input.trim();
      if (/^https?:\/\//i.test(trimmed)) return trimmed;
      if (/^[a-z0-9-]+(\.[a-z0-9-]+)+/i.test(trimmed)) return 'https://' + trimmed;
      return 'https://duckduckgo.com' + encodeURIComponent(trimmed);
    }

    async function runSearch() {
      const val = queryInput.value.trim();
      if (!val) return;

      const wispServer = wispInput.value.trim();
      localStorage.setItem('custom_wisp_url', wispServer);

      const targetUrl = formatTargetUrl(val);
      statusEl.textContent = 'Step 1/3: Loading Epoxy module...';

      try {
        const cdnUrl = ['https://cdn.jsdelivr.net', 'npm', '@mercuryworkshop/epoxy-transport@3', '+esm'].join('/');
        const mod = await import(cdnUrl);
        const EpoxyClient =
          mod.EpoxyClient ||
          (mod.default && mod.default.EpoxyClient) ||
          (typeof mod.default === 'function' ? mod.default : null);

        if (!EpoxyClient) {
          throw new Error('Could not find EpoxyClient in exports: ' + Object.keys(mod).join(', '));
        }

        statusEl.textContent = 'Step 2/3: Connecting to Wisp...';
        const transport = new EpoxyClient({ wisp: wispServer });
        await transport.init();

        statusEl.textContent = 'Step 3/3: Fetching page...';
        const response = await transport.request(
          new URL(targetUrl),
          'GET',
          null,
          Object.entries({ 'User-Agent': navigator.userAgent })
        );

        const html = await new Response(response.body).text();
        const baseTag = '<base href="' + targetUrl + '" />';
        const patchedHtml = /<head[^>]*>/i.test(html)
          ? html.replace(/<head[^>]*>/i, (match) => match + baseTag)
          : baseTag + html;

        const blob = new Blob([patchedHtml], { type: 'text/html' });
        viewport.src = URL.createObjectURL(blob);
        viewport.style.display = 'block';
        homeBtn.style.display = 'block';
        statusEl.textContent = 'Script Active';
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message + '\n' + (err.stack || '').split('\n').slice(0, 3).join('\n');
      }
    }

    goBtn.onclick = runSearch;
    queryInput.onkeydown = (e) => {
      if (e.key === 'Enter') runSearch();
    };
  </script>
</body>
</html>
