name: Fetch Epoxy
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm pack @mercuryworkshop/epoxy-transport@3.0.2
          tar -xzf mercuryworkshop-epoxy-transport-3.0.2.tgz
          cp package/dist/index.mjs epoxy.js
          rm -rf package mercuryworkshop-epoxy-transport-3.0.2.tgz
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add epoxy.js
          git commit -m "Add epoxy.js" || exit 0
          git push
